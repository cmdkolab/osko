<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="OS(KO) - Advanced browser-based operating system with window management, virtual file system, and multi-language support.">
    <meta name="theme-color" content="#1e293b">
    

    <meta property="og:type" content="website">
    <meta property="og:title" content="OS(KO) - Browser OS">
    <meta property="og:description" content="Elite browser-based desktop experience with advanced window management and VFS.">
    <meta property="og:image" content="assets/icons/256.png">

    <title>OS(KO)</title>
    
    <link rel="manifest" href="app.webmanifest">
    <link rel="stylesheet" href="osko.min.css">
    <link rel="icon" type="image/png" href="assets/icons/256.png">
</head>

<body>
    <div id="boot-screen">
        <div class="boot-content">
            <img src="assets/icons/256.png" alt="OSKO Logo" class="boot-logo">
            <div class="boot-loader">
                <div class="loader-bar"></div>
            </div>
            <p class="boot-status"></p>
        </div>
    </div>

    <main id="desktop" role="main">
        <div id="desktop-icons" role="list"></div>
        <div id="window-layer"></div>
    </main>

    <nav id="taskbar" role="navigation">
        <div class="taskbar-blur"></div>
        <button id="search-btn" class="search-btn" aria-label="Search">🔍</button>
        <button id="switcher-btn" class="switcher-btn" aria-label="Task View">+</button>
        <div id="running-apps" role="list"></div>
        <div id="system-tray">
            <span id="hdd-usage" class="tray-item">0 B</span>
            <span id="clock" role="timer" aria-label="Clock">00:00:00</span>
        </div>
    </nav>
    <div id="notification-center" role="log" aria-live="polite"></div>
    <script src="osko.min.js"></script>
</body>

</html>
