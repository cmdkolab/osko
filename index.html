<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS(KO) - Browser OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="desktop" role="main">
        <div id="desktop-icons" role="list"></div>
        <div id="window-layer"></div>
    </main>
    <nav id="taskbar" role="navigation">
        <div class="taskbar-blur"></div>
        <div id="search-btn" class="search-btn" title="Szukaj (Ctrl+Space)">🔍</div>
        <div id="switcher-btn" class="switcher-btn" title="Widok zadań (Multitasking)">+</div>
        <div id="running-apps" role="list"></div>
        <div id="system-tray">
            <span id="hdd-usage" class="tray-item" title="Zajętość dysku">0 B</span>
            <span id="clock" role="timer">00:00:00</span>
        </div>
    </nav>
    <div id="notification-center" role="log" aria-live="polite"></div>
    <script src="i18n.js"></script>
    <script src="system/utils.js"></script>
    <script src="system/db.js"></script>
    <script src="system/storage.js"></script>
    <script src="system/state.js"></script>
    <script src="system/vfs.js"></script>
    <script src="system/syslog.js"></script>
    <script src="system/session.js"></script>
    <script src="system/eventbus.js"></script>
    <script src="system/notifications.js"></script>
    <script src="system/audio.js"></script>
    <script src="system/permissions.js"></script>
    <script src="system/ui.js"></script>
    <script src="system/windowmanager.js"></script>
    <script src="system/theme.js"></script>
    <script src="system/webos.js"></script>
    <script src="system/init.js"></script>
    <script>
        WebOS.installApp('apps/about');
        WebOS.installApp('apps/notes');
        WebOS.installApp('apps/explorer');
        WebOS.installApp('apps/settings');
        WebOS.installApp('apps/taskmanager');
        WebOS.installApp('apps/syslog');
        WebOS.installApp('apps/calculator');
        WebOS.installApp('apps/terminal');
    </script>
</body>

</html>
